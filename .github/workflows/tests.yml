name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # opencv-contrib-python importa libGL.so.1 e libglib mesmo sem
      # abrir janela; sem estas libs a coleta da suíte morre no import.
      - name: Dependências de sistema do OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Dependências Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: "Lint: nome indefinido, sintaxe, import quebrado"
        run: ruff check .
      - name: Testes
        run: pytest -q
      - name: Selftest do pipeline (cena sintética)
        run: python tests/selftest.py
