[tool.pytest.ini_options]
# Num clone limpo, `pytest` roda a suite inteira: testes do app e os
# testes do runner. Antes, um `pytest` sem argumentos dependia do
# diretório e `pytest tests tools/runner/tests` morria na coleta por
# causa de imports de credencial e de arquivos de laboratório.
testpaths = ["tests", "tools/runner/tests"]
norecursedirs = [".venv", ".git", "captures", "models"]
# O skip dos testes que precisam de arquivo preparado à mão é
# intencional e vem com o motivo; não precisa virar aviso.
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 88
# Notebooks trazem código duplicado de células (imports repetidos) e
# não são o alvo do linter de biblioteca.
# docs/analise/probes/ são scripts de operador (sondas e benchmarks
# que sustentam docs/analise/): rodam uma vez, imprimem e saem, e não
# seguem o estilo da biblioteca. O F821/F841 deles foi corrigido à
# mão; o resto do estilo não é o alvo deste conjunto.
extend-exclude = [".venv", "notebooks", "docs/analise/probes"]

[tool.ruff.lint]
# Subconjunto de erro de verdade (nome indefinido, sintaxe, import
# quebrado). O estilo do repositório não é uniforme e uma regra
# ampla reprovaria o código atual inteiro; o CI usa este conjunto.
select = ["E4", "E7", "E9", "F"]
